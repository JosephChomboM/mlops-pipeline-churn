name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.1
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  pipeline:
    # The full simulation is the end-to-end test: a model that fails the gates
    # or a broken validation step fails the build before any image is built.
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[serving,pipeline]"
      - run: churn simulate
      - run: cat reports/simulation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build images and smoke test the API
        run: |
          docker build -f docker/api.Dockerfile -t churn-api .
          docker build -f docker/pipeline.Dockerfile -t churn-pipeline .
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/model
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d @tests/fixtures/customer.json
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
